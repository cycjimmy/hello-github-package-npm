name: Coveralls

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  coveralls:
    name: coveralls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies and make test-coverage
        run: |
          npm ci
          npm run coveralls

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
