name: Dependabot Auto Merge
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    # Fork pull requests never receive a write token, so gate on the same-repo branch too.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A stuck check must fail the job instead of holding a runner for six hours
    timeout-minutes: 30
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      # `main` carries no required status check, because semantic-release has to
      # push its version commit there and GitHub rejects that push while one is
      # configured. The gate therefore lives here: wait for the checks to settle
      # and only then ask for the merge.
      - name: Wait for the pull request checks
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The other workflows may not have registered their checks yet
          for _ in $(seq 1 30); do
            count=$(gh pr checks "$PR_URL" --json name --jq 'length' 2>/dev/null || true)
            [ "${count:-0}" -gt 0 ] && break
            sleep 10
          done
          gh pr checks "$PR_URL" --watch --fail-fast

      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
